# Pre-commit hooks for bpp. Install once after clone with:
#   pip install -e ".[dev]" && pre-commit install
#
# Run on demand without committing: `pre-commit run --all-files`
#
# Scope today: just the eslint-globals.json drift check. That file is
# auto-generated by `scripts/generate-eslint-globals.mjs` from every
# top-level function/var in `bpp/web/static/js/`. CI verifies it's in
# sync via `git diff --exit-code` on every PR to `main`, but the catch
# happens far from the cause (weeks of commits later, when the PR is
# finally cut). This hook moves the catch to commit time.
#
# Other style gates (`ruff check`, `prettier --check`, `tsc --noEmit`,
# vitest) are intentionally NOT in here yet — they're already part of
# the maintainer's manual gate flow and adding them would slow every
# commit. Revisit when a contributor base materializes.

repos:
  - repo: local
    hooks:
      - id: eslint-globals-sync
        name: eslint-globals.json in sync with bpp/web/static/js/
        language: system
        # Regenerate the globals file from current JS sources, then
        # bail if the regenerated version differs from what git is
        # about to commit. The diff fails the commit; the contributor
        # runs `npm run lint:globals && git add .eslint-globals.json`
        # and retries.
        entry: bash -c 'npm run --silent lint:globals && git diff --exit-code .eslint-globals.json'
        # Only fire when JS that contributes to the globals scan
        # actually changes (or when the globals file itself is being
        # touched).
        files: ^(bpp/web/static/js/.+\.(mjs|js)|\.eslint-globals\.json)$
        # The hook checks a single global file, not per-file results.
        pass_filenames: false

      - id: pm-schema-lint
        name: docs/pm.md conforms to arkos pm-backlog-schema
        language: system
        # Validate docs/pm.md against the cross-repo canon
        # (~/Repos/arkos/prompts/pm-backlog-schema.md). --auto: enforces
        # strict only once the migration sentinel is present, else warns.
        # No-op (exit 0) only when arkos isn't checked out — e.g. CI / a
        # fresh contributor; otherwise the linter's exit code blocks the
        # commit so a malformed pm.md can't land.
        entry: bash -c 'L="$HOME/Repos/arkos/tools/pm-lint.sh"; [ -x "$L" ] || exit 0; exec "$L" --auto docs/pm.md'
        files: ^docs/pm\.md$
        pass_filenames: false
