version: 2

# Dependabot config for Best Photo Picker.
#
# Tuning notes:
#   - Weekly cadence everywhere — daily floods the inbox; monthly
#     misses real CVE windows. Weekly is the sweet spot for a
#     single-maintainer OSS project.
#   - PR limit caps the in-flight Dependabot PR count so a quiet
#     month doesn't dump 30 upgrades in one Sunday.
#   - Grouped updates collapse routine version bumps into one PR
#     per ecosystem so review effort scales with breaking-change
#     risk, not dependency count.
#   - Labels mirror the conventions in the issue templates so the
#     existing GitHub label set covers Dependabot PRs without
#     manual relabeling.
#
# Takes effect once Dependabot alerts and version updates are
# enabled in Settings → Code security.
#
# Version-update PRs are paused: every `open-pull-requests-limit` is 0.
# Security updates are configured separately in Settings and are not
# affected. To resume, restore the limits (pip 5, actions 5, npm 3,
# desktop npm 3, cargo 3, docker 2).

updates:
  # Python — the runtime install + the dev-extra pin live in
  # pyproject.toml. Hatchling reads it; Dependabot supports the
  # PEP 621 schema directly under the `pip` ecosystem name.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — every workflow pins each action to a commit SHA
  # with its version in a trailing comment (`@<sha> # v7`), so a moved
  # tag can't swap in different code. Dependabot updates the SHA and
  # the comment together. The packaging tests pin the
  # no-`@main`/`@master` rule so a Dependabot bump can't
  # accidentally introduce one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # Frontend dev tooling at repo root — eslint, prettier, vitest,
  # typescript. Used only by the `lint` / `typecheck` / `test:js`
  # CI gates; nothing ships to users from this manifest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "javascript"
    groups:
      js-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Tauri desktop wrapper. Updates can break native menu/IPC
  # behaviour — keep these on the same cadence but ungrouped so
  # each one is reviewed individually. Cargo updates for the Rust
  # side ride along under the `cargo` ecosystem below.
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "javascript"
      - "desktop"

  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "rust"
      - "desktop"

  # Docker base image — the runtime python:3.11-slim and the
  # apt-installed system libs (libgl1, libglib2.0, libegl1, libgles2)
  # ship to every container user; their CVEs land here.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"
