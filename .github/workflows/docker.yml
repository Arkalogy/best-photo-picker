name: Publish Docker image

# Builds the self-hosting image for amd64 + arm64 and, when asked,
# pushes it to the GitHub Container Registry as
# ghcr.io/arkalogy/bppicker. It runs on a published GitHub Release
# (always pushing, like publish.yml does for PyPI), or by hand from the
# Actions tab, where publish=false gives a build-only check.
#
# Which tags move: a manual push gets only the commit tag (sha-xxxxxxx),
# plus the ref name when run from a tag, unless release_tags=true is set
# on purpose from main, whose app code is the released version. A prerelease gets its release tag and the
# commit tag only; `latest` and the version tags never move on one
# (`flavor: latest=false` below keeps metadata-action from adding
# `latest` on its own).
# Pushing uses the workflow's own GITHUB_TOKEN, so there are no
# secrets to set up. After the first push, set the package's
# visibility to public once (Packages -> bppicker -> Package settings).
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to ghcr.io? (false = build-only smoke test)"
        required: true
        default: "false"
      release_tags:
        description: "Also move `latest` and the app-version tag? Only when the app code here is the released version."
        required: true
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Only attempt to log in / push when explicitly publishing.
    # `do_push` is the single source of truth used in three steps below.
    env:
      do_push: ${{ github.event_name == 'release' || github.event.inputs.publish == 'true' }}
      # `latest` and the version tag: a stable release, or a manual push
      # that asked for them.
      release_tags: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event.inputs.publish == 'true' && github.event.inputs.release_tags == 'true' && github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false

      # QEMU lets the x86_64 runner build the arm64 image under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # buildx is the multi-platform builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Login only when pushing; a build-only run never touches the registry.
      - name: Login to the GitHub Container Registry
        if: env.do_push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app version from pyproject.toml, so an image built from main
      # is tagged with the release it contains (e.g. 0.2.3) even though
      # the run is not on a tag ref.
      - name: Read the app version
        id: ver
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$v" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Say when release_tags is ignored
        if: github.event.inputs.release_tags == 'true' && env.release_tags != 'true'
        run: echo "::warning::release_tags=true needs publish=true and a run from main; ignored here"

      # A release must contain the version it is named after, or its
      # image would overwrite another version's tag (publish.yml checks
      # the same for PyPI).
      - name: Verify the release tag matches the app version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/arkalogy/bppicker
          flavor: latest=false
          # `type=sha` guarantees at least one tag on a manual run from a
          # branch: the ref rule only fires on tag refs and
          # `latest` only when pushing, so without it a build-only smoke
          # test from a branch emits zero tags and the check below fails.
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ env.release_tags == 'true' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ env.release_tags == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ env.release_tags == 'true' }}

      - name: Build and (optionally) push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # linux/amd64 covers the bulk of cloud + Intel-Mac users;
          # linux/arm64 covers Apple Silicon + Raspberry Pi 4/5 +
          # AWS Graviton. No 32-bit ARM — the ML wheels don't ship
          # for armv7 anyway.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.do_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache so repeat builds skip unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs on build-only runs too: prints the tags metadata-action
      # computed and fails if there are none.
      - name: Show resulting tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "do_push: $do_push"
          echo "tags emitted by metadata-action:"
          echo "$TAGS"
          if [ -z "$TAGS" ]; then
            echo "::error::metadata-action produced no tags"
            exit 1
          fi
