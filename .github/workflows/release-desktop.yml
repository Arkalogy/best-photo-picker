name: Desktop App (macOS)

# Builds the signed + notarized macOS desktop app, packages it in a
# signed + notarized DMG, and attaches it
# to the GitHub Release that triggered the run. Mirrors publish.yml's
# safety: fires ONLY when a Release is *published* (the explicit button
# on the Releases page) — drafting, saving, or pushing never triggers
# it. workflow_dispatch is a build-only smoke test (no upload) — use it
# to validate the signing/notarization chain WITHOUT cutting a release
# tag (notarization typically takes 2-3 tries to get right).
#
# Code signing + notarization (decision 2026-06-17, supersedes the
# 2026-06-11 unsigned decision): the app is signed with the Arkalogy
# Developer ID certificate and notarized by Apple so it opens on
# double-click — no Gatekeeper "Open Anyway" detour. Tauri reads the
# six APPLE_* env vars below and signs + notarizes + staples the .app
# automatically. Tauri does not notarize the DMG wrapper, so a separate
# step submits and staples the DMG itself. If the
# secrets are absent (e.g. a fork), the build still produces an
# UNSIGNED DMG so CI doesn't hard-fail — only Arkalogy releases are
# signed. pipx remains the canonical install path for technical users;
# this DMG is the front door for non-technical users.
#
# Required repo secrets (maintainer sets these once — see
# docs/macos-signing.md):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID                    Apple account email (for notarization)
#   APPLE_PASSWORD              app-specific password (NOT the account pw)
#   APPLE_TEAM_ID               10-char Apple Developer Team ID
#
# Cost note: macOS runners bill at 10x Linux minutes and the
# torch-bundling sidecar build is heavy (~20-30 min wall). That cost
# is incurred only on explicit release publishes and manual smoke runs.

on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default. The build job installs and runs a lot of
# third-party code (pip/npm packages, PyInstaller, upstream source
# downloads), so it never holds a token that can write to the repo; only
# the small upload-release job below — which runs no third-party code —
# gets `contents: write`.
permissions:
  contents: read

jobs:
  build-macos-app:
    runs-on: macos-15 # Apple Silicon; arm64-only artifact (Intel deferred)
    timeout-minutes: 60
    env:
      # The extras the sidecar is built with — also the inventory's scope.
      BPP_EXTRAS: web,heic,faces,raw,inpaint
      # Release asset names, used by every step below. NOTICE.txt names
      # these files, so rename them there too.
      INVENTORY_ASSET: bppicker-third-party-inventory.json
      SOURCES_ASSET: bppicker-third-party-sources.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false

      - name: Verify tag matches package version
        # Same guard as publish.yml: never attach an app whose internal
        # version disagrees with the release tag. Only meaningful on the
        # release event; the workflow_dispatch smoke path is exempt.
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Read __version__ as text — importing bpp eagerly loads bpp.registry
          # (cryptography), which isn't installed in this job.
          PKG_VERSION=$(grep -E '^__version__' bpp/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          CARGO_VERSION=$(grep -E '^version' desktop/src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag '$TAG_VERSION' vs package '$PKG_VERSION' vs tauri.conf '$TAURI_VERSION' vs Cargo.toml '$CARGO_VERSION' — versions must all agree. Bump pyproject.toml, bpp/__init__.py, desktop/src-tauri/tauri.conf.json and desktop/src-tauri/Cargo.toml before tagging."
            exit 1
          fi
          echo "OK: tag $TAG_VERSION matches package and tauri.conf"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11" # pinned — matches the sidecar/CI pin

      - name: Install bpp + PyInstaller
        # Full extras so the frozen sidecar has feature parity with a
        # maxed-out pip install (optional features can't pip-install
        # themselves inside a frozen binary at runtime). The same
        # BPP_EXTRAS list scopes the third-party inventory below.
        run: |
          python -m pip install --upgrade pip
          pip install ".[${BPP_EXTRAS}]" pyinstaller

      - name: Verify the live model registry manifest
        # Same gate as publish.yml: the app must not ship against a
        # manifest its own verifier rejects.
        if: github.event_name == 'release'
        run: python scripts/verify_live_registry.py

      # ── Third-party inventory + corresponding sources ────────────────
      # These steps run after the Release is already published, so none
      # of them may stop the DMG from being attached: each records its
      # outcome as a step output and the "Stage release assets" step
      # reports anything missing (warning + job-summary error). The
      # written offer in NOTICE.txt covers a release whose sources have
      # to be attached by hand. workflow_dispatch smoke runs are strict
      # instead: the last step fails them if any of these didn't succeed.

      - name: Inventory the sidecar's third-party code
        # Offline. Every distribution in the bppicker[$BPP_EXTRAS]
        # dependency closure with its license and the shared libraries
        # it installs, plus the CPython runtime and the PyInstaller
        # bootloader. Build-only tools (pip, PyInstaller, ...) are out
        # of scope.
        id: inventory
        run: |
          if python scripts/third_party_inventory.py inventory \
              --out third-party --extras "$BPP_EXTRAS"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Third-party inventory failed — the release will not carry it"
          fi

      - name: Fetch the pinned HEIC/RAW sources
        # Network. The x265 / libde265 / libheif archives and patches
        # named in pillow-heif's build recipe at the installed tag, and
        # the LibRaw commits rawpy pins, each download retried 3 times.
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python scripts/third_party_inventory.py sources --out third-party \
              && tar czf "$SOURCES_ASSET" -C third-party third-party-sources; then
            ls -lh "$SOURCES_ASSET"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            rm -f "$SOURCES_ASSET"
            echo "::warning::Couldn't fetch the pinned HEIC/RAW sources — attach $SOURCES_ASSET to the release by hand"
          fi

      - name: Build sidecar (PyInstaller)
        run: bash desktop/build-sidecar.sh

      - name: Record what PyInstaller bundled
        # Offline. Reads the frozen sidecar's archive and adds, to the
        # inventory, every packed file attributed to its distribution /
        # the Python runtime / PyInstaller, plus any distribution
        # PyInstaller collected outside the dependency closure.
        id: bundled
        if: steps.inventory.outputs.ok == '1'
        run: |
          if python scripts/third_party_inventory.py bundled \
              --out third-party --binary dist/bpp-server; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't read the sidecar archive — the inventory lacks the bundled-file list"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (signed + notarized .app in a signed DMG)
        # Tauri signs + notarizes + staples automatically when the
        # APPLE_* env vars are present. If they're absent (a fork
        # without the secrets), it falls back to an unsigned DMG rather
        # than failing the build. --bundles dmg gives the familiar
        # double-click → drag-to-Applications installer.
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles dmg

      - name: Rename DMG to a stable, version-less asset name
        # The download page links to the "latest release" stable URL
        # (…/releases/latest/download/<name>), which can't carry a
        # version in the filename. Tauri emits a versioned DMG; copy it
        # to the stable name the page expects.
        run: |
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          SRC=$(ls "$DMG_DIR"/*.dmg | head -1)
          OUT="BestPhotoPicker-macOS-arm64.dmg"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Verify the signed sidecar starts and serves
        # The sidecar is signed with the hardened runtime inside the app.
        # If its entitlements are wrong, macOS refuses to load its own
        # Python (or a library the server loads later) and the app can
        # never reach the server; running it from the DMG is the only
        # check that sees the signed binary as a user would. Both steps
        # are time-bounded (macOS runners have no `timeout`), the verdict
        # is printed before the image is detached, and the step hard-fails
        # the release before anything is uploaded.
        run: |
          mount="$RUNNER_TEMP/dmg-mount"
          lib="$RUNNER_TEMP/gate-library"
          mkdir -p "$mount" "$lib"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$ARTIFACT"
          server="$mount/Best Photo Picker.app/Contents/MacOS/bpp-server"
          ok=1
          # 1. the runtime loads
          version="$(perl -e 'alarm 120; exec @ARGV' "$server" --version 2>&1 || true)"
          echo "$version" | tail -3
          echo "$version" | grep -q "^bpp " || { ok=0; echo "::error::the signed sidecar does not start"; }
          # 2. the server comes up and answers (the lazily loaded libraries)
          if [ "$ok" = 1 ]; then
            "$server" serve --library "$lib" --no-browser --open-loopback --port 5099 > "$RUNNER_TEMP/gate-serve.log" 2>&1 &
            pid=$!
            up=0
            for _ in $(seq 1 120); do
              if curl -sf -o /dev/null http://127.0.0.1:5099/; then up=1; break; fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            tail -5 "$RUNNER_TEMP/gate-serve.log"
            [ "$up" = 1 ] || { ok=0; echo "::error::the signed sidecar did not serve a page within 120 s"; }
          fi
          hdiutil detach "$mount" -quiet || true
          [ "$ok" = 1 ]

      - name: Notarize and staple the DMG
        # Tauri notarizes the .app but not the DMG around it, so
        # Gatekeeper would otherwise report the download itself as
        # "Unnotarized Developer ID". Skipped when the signing secrets
        # are absent (forks produce an unsigned DMG).
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "::warning::No signing secrets — DMG left unnotarized"
            exit 0
          fi
          xcrun notarytool submit "$ARTIFACT" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$ARTIFACT"
          xcrun stapler validate "$ARTIFACT"
          echo "DMG_NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Verify Gatekeeper accepts the DMG
        # A green "source=Notarized Developer ID" is the whole point.
        # Hard-fails whenever the DMG was notarized above, so a release
        # can never ship a DMG that Gatekeeper rejects.
        if: env.DMG_NOTARIZED == '1'
        run: |
          spctl -a -t open --context context:primary-signature -vv "$ARTIFACT" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: Stage release assets
        # Builds the upload list from what actually exists: the DMG
        # always, the inventory and the sources archive only if their
        # steps succeeded. Anything missing is reported here.
        if: always() && env.ARTIFACT != ''
        env:
          INVENTORY_OK: ${{ steps.inventory.outputs.ok }}
          SOURCES_OK: ${{ steps.sources.outputs.ok }}
          BUNDLED_OK: ${{ steps.bundled.outputs.ok }}
        run: |
          ASSETS="$ARTIFACT"
          MISSING=""
          if [ "$INVENTORY_OK" = "1" ]; then
            cp third-party/third-party-inventory.json "$INVENTORY_ASSET"
            ASSETS="$ASSETS $INVENTORY_ASSET"
            [ "$BUNDLED_OK" = "1" ] || MISSING="$MISSING the inventory's bundled-file list;"
          else
            MISSING="$MISSING $INVENTORY_ASSET;"
          fi
          if [ "$SOURCES_OK" = "1" ] && [ -f "$SOURCES_ASSET" ]; then
            ASSETS="$ASSETS $SOURCES_ASSET"
          else
            MISSING="$MISSING $SOURCES_ASSET;"
          fi
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          if [ -n "$MISSING" ]; then
            echo "::error title=Third-party assets incomplete::Missing:$MISSING generate and attach them to this release by hand (NOTICE.txt's written offer still applies)."
            {
              echo "## :x: Third-party inventory/sources incomplete"
              echo ""
              echo "Missing:$MISSING"
              echo ""
              echo "The DMG was still attached. Re-run \`scripts/third_party_inventory.py\` against this release's build environment and attach the missing files with \`gh release upload\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # shellcheck disable=SC2086 # ASSETS is a space-separated file list
          ls -lh $ASSETS
          mkdir -p release-assets
          # shellcheck disable=SC2086
          cp $ASSETS release-assets/

      - name: Hand the release assets to the upload job
        # This job has no write token; upload-release attaches them.
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          retention-days: 3 # room to re-run a failed upload-release
          compression-level: 0 # the DMG is already compressed

      - name: Upload smoke-test artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-dmg
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.INVENTORY_ASSET }}
            ${{ env.SOURCES_ASSET }}
          retention-days: 7

      - name: Fail the smoke run if the inventory is incomplete
        # Release runs never fail here (the DMG must still ship); manual
        # smoke runs do, so a broken inventory surfaces before a release.
        if: >-
          github.event_name == 'workflow_dispatch' && (
          steps.inventory.outputs.ok != '1' ||
          steps.sources.outputs.ok != '1' ||
          steps.bundled.outputs.ok != '1')
        run: |
          echo "::error::Inventory ${{ steps.inventory.outputs.ok }} / sources ${{ steps.sources.outputs.ok }} / bundled ${{ steps.bundled.outputs.ok }} (1 = ok)"
          exit 1

  upload-release:
    # The only job that can write to the repo. It runs no third-party code
    # (no checkout, no installs, no builds): it downloads the files the
    # build job staged and attaches them to the published release.
    needs: build-macos-app
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-assets
          gh release upload "${GITHUB_REF#refs/tags/}" release-assets/* \
            --clobber --repo "$GITHUB_REPOSITORY"

