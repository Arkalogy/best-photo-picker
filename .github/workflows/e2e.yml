# Playwright e2e test suite.
#
# The e2e suite needs a running Flask server backed by a real (analyzed)
# library. We provision one on the fly with scripts/setup_e2e_library.py
# (12 procedural photos, no network). Analysis runs once and is cached
# inside the workflow's tmp library — no external assets required.
#
# Triggers:
#   - workflow_dispatch:   manual runs from the Actions tab for branch QA
#   - push.tags v*.*.*:    runs the suite against a release tag as soon as
#                          it's pushed (publishing a release creates it).
#                          It runs alongside publish.yml and
#                          release-desktop.yml and does not gate them, so
#                          a failure here flags a regression in the
#                          tagged release to fix in a follow-up.
#
# Not on PRs: analyze + model downloads + browser fixtures total ~3-5
# minutes and would burn paid Actions minutes on every push. The main
# CI job already parse-checks the spec files via `playwright test --list`.

name: E2E

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run e2e on"
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-3.11-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1 libglib2.0-0 libegl1 libgles2

      - name: Install package with all dependencies
        run: |
          pip install --upgrade pip "setuptools<82"
          pip install git+https://github.com/ageitgey/face_recognition_models
          pip install -e ".[dev,web,faces,heic,raw]"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dev deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e (synthetic + empty passes)
        env:
          BPP_E2E_LIBRARY: ${{ runner.temp }}/bpp_e2e_library
          # Per-run acceptance log so the registry-picker accept tests are
          # deterministic (a model isn't "already accepted" from a prior
          # run) and the suite never writes to a developer's real
          # ~/.config/bpp acceptance log.
          BPP_ACCEPTANCE_LOG_PATH: ${{ runner.temp }}/bpp_e2e_accept.jsonl
          # Pin the server log to a known path so the failure artifact below
          # can always find it (run_e2e.sh's mktemp fallback honors $TMPDIR,
          # which isn't guaranteed to be /tmp on the runner).
          BPP_E2E_SERVER_LOG: ${{ runner.temp }}/bpp_e2e_server.log
        run: |
          # The runner provisions each fixture, starts/stops the server on
          # :5001 per pass, and runs the matching Playwright grep:
          #   synthetic → every spec except @demo/@empty
          #   empty     → @empty (brand-new library, onboarding first_run)
          # The @demo pass is LOCAL ONLY — CI has no demo library.
          bash scripts/run_e2e.sh ci

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bpp-server-log
          path: ${{ runner.temp }}/bpp_e2e_server.log
          if-no-files-found: ignore

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
